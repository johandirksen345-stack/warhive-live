# WARHIVE live headlines server (free, runs on GitHub, no computer of your own needed).
# Every 15 minutes this asks GDELT for recent news headlines per conflict area and publishes them
# as live.json on the "live" branch of this repository. The website reads that file.
# Setup: put this file in your repository at  .github/workflows/live.yml
name: live-news

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: live-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch headlines from GDELT
        run: |
          set -eu
          mkdir -p work
          cd work
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth=1 origin live; then
            git show FETCH_HEAD:live.json > prev.json || rm -f prev.json
          fi
          cat > fetch_live.mjs <<'EOF'
          // WARHIVE live headlines: asks the GDELT DOC API for recent English-language news per conflict area
          // and writes live.json. Headlines only (title, link, source, time). Nothing is invented or rewritten.
          import { readFileSync, writeFileSync, existsSync } from "node:fs";
          import { pathToFileURL } from "node:url";

          // Same searches as the website (TH in data.js). Keep them in sync if you change them there.
          export const THEATERS = {
            UKR: "(Ukraine OR Russia) (strike OR drone OR missile OR attack)",
            SDN: "Sudan (drone OR RSF OR airstrike OR attack)",
            MEA: "(Gaza OR Israel OR Iran OR Lebanon OR Hormuz) (strike OR attack)",
            MMR: "Myanmar (airstrike OR junta OR military)"
          };

          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

          function clean(list) {
            const seen = new Set();
            const out = [];
            for (const a of Array.isArray(list) ? list : []) {
              if (!a || typeof a.url !== "string" || !/^https:\/\//.test(a.url) || !a.title) continue;
              if (seen.has(a.url)) continue;
              seen.add(a.url);
              out.push({
                url: a.url,
                title: String(a.title).replace(/\s+/g, " ").trim().slice(0, 220),
                seendate: typeof a.seendate === "string" ? a.seendate : "",
                domain: typeof a.domain === "string" ? a.domain : "",
                language: typeof a.language === "string" ? a.language : ""
              });
            }
            return out;
          }

          async function fetchOne(fetchFn, q, gapMs) {
            const url = "https://api.gdeltproject.org/api/v2/doc/doc?query=" + encodeURIComponent(q + " sourcelang:english") +
              "&mode=artlist&format=json&maxrecords=25&sort=datedesc&timespan=24h";
            let lastErr = "unknown";
            for (let attempt = 1; attempt <= 3; attempt++) {
              try {
                const res = await fetchFn(url, { signal: AbortSignal.timeout(25000), headers: { "User-Agent": "warhive-live/1.0" } });
                const text = await res.text();
                if (!res.ok) throw new Error("HTTP " + res.status);
                let json;
                try { json = JSON.parse(text); } catch { throw new Error("not JSON (probably rate limited): " + text.slice(0, 60)); }
                return clean(json.articles || []);
              } catch (e) {
                lastErr = String(e && e.message || e);
                if (attempt < 3) await sleep(gapMs * 1.5);
              }
            }
            throw new Error(lastErr);
          }

          export async function run({ fetchFn = fetch, prevPath = "prev.json", outPath = "live.json", gapMs = Number(process.env.GAP_MS) || 6000, now = new Date() } = {}) {
            let prev = {};
            try { if (existsSync(prevPath)) prev = JSON.parse(readFileSync(prevPath, "utf8")).theaters || {}; } catch { prev = {}; }
            const theaters = {};
            const status = {};
            let okCount = 0;
            const keys = Object.keys(THEATERS);
            for (let i = 0; i < keys.length; i++) {
              const k = keys[i];
              try {
                theaters[k] = await fetchOne(fetchFn, THEATERS[k], gapMs);
                status[k] = "ok";
                okCount++;
              } catch (e) {
                // keep the previous headlines for this area; the website drops anything older than 30 hours by itself
                theaters[k] = clean(prev[k]);
                status[k] = "failed: " + String(e.message).slice(0, 80);
                console.log("::warning::" + k + " could not be fetched: " + e.message);
              }
              if (i < keys.length - 1) await sleep(gapMs); // GDELT asks for at most one request per 5 seconds
            }
            if (okCount === 0) {
              console.log("::warning::GDELT did not answer for any area. The old live.json stays online.");
              return { written: false, status };
            }
            const doc = { updated: now.toISOString(), source: "GDELT DOC 2.0 API (headlines only)", status, theaters };
            writeFileSync(outPath, JSON.stringify(doc));
            console.log("live.json written: " + keys.map((k) => k + "=" + theaters[k].length).join(" "));
            return { written: true, status, doc };
          }

          if (process.argv[1] && import.meta.url === pathToFileURL(process.argv[1]).href) {
            await run();
          }
          EOF
          node fetch_live.mjs

      - name: Publish live.json
        run: |
          set -eu
          cd work
          if [ ! -f live.json ]; then
            echo "No new data this time. The previous live.json stays online."
            exit 0
          fi
          git checkout -q --orphan out
          git add live.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Update live.json"
          git push -q --force origin out:live

      - name: Keep the schedule switched on
        continue-on-error: true
        run: gh workflow enable live.yml --repo "$GITHUB_REPOSITORY"
